[project]
name = "conversa"
version = "0.1.0"
description = ""
authors = [
    {name = "mustela",email = "ejankowski@gmail.com"}
]
packages = [
    { include = "app" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.scripts]
dev = "run:dev"
worker = "run_worker:main"
nats_worker = "run_nats_worker:main"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "v0.141.1"
python-dotenv = "^1.2.3"
sqlalchemy = "^2.0.54"
asyncpg = "^0.31.0"
gunicorn = "26.2.0"
alembic = "^1.20.0"
faker = "40.39.0"
psycopg2-binary = "^2.9.13"
pydantic = {extras = ["email"], version = "^2.13.5"}
black = "^26.1.0"
ruff = "0.16.8"
pydantic-settings = "^2.9.1"
python-jose = "^3.3.0"

opentelemetry-instrumentation-fastapi = "^0.64b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation-sqlalchemy = "^0.64b0"
opentelemetry-instrumentation-logging = "^0.64b0"
prometheus-client = ">=0.26.0"
opentelemetry-instrumentation-requests = "^0.64b0"
opentelemetry-instrumentation-celery = "0.64b0"
prometheus-fastapi-instrumentator = "^8.1.0"

requests = "^2.32.3"
pyjwt = "^2.14.0"
sqlalchemy-json = "^0.7.0"
cryptography = "^50.0.0"
fernet = "^1.0.1"
celery = "^5.5.2"
rollbar = "^1.5.0"
redis = "^7.0.0"
fastapi-pagination = "^0.16.0"
# tessera-sdk = { path = "../tessera-sdk-py/", develop = true }
tessera-sdk = { git = "https://github.com/tesserahq/tessera-sdk-py.git", branch = "main" }
apscheduler = "<4"
pytz = "^2025.2"
mako = "^1.4.3"
faststream = {extras = ["nats"], version = "^0.7.7"}
python-telegram-bot = "22.8"
slack-bolt = ">=1.30.0"
aiohttp = "^3.14.3"

[tool.poetry.dependencies.uvicorn]
extras = [ "standard" ]
version = "^0.53.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
httpx = "^0.28.0"  # Required by FastAPI TestClient
pytest-asyncio = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
